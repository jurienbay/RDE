<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sharp retro chiseled lighting states gradients -->
    <linearGradient id="bevel-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2" />
      <stop offset="100%" stop-color="#b8b8b8" />
    </linearGradient>
    <linearGradient id="bevel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b6b6b" />
      <stop offset="100%" stop-color="#3d3d3d" />
    </linearGradient>
  </defs>

  <!-- Background Matte Plate Fill -->
  <rect width="128" height="128" fill="#aeaeae" rx="4" />

  <!-- Outer 1px Thin Solid Etch Border Rim -->
  <rect x="0.5" y="0.5" width="127" height="127" fill="none" stroke="#000000" stroke-width="1" rx="4" />

  <!-- ========================================================================= -->
  <!-- CRT MONITOR BEZEL HOUSING PANEL LAYER                                    -->
  <!-- ========================================================================= -->
  <!-- Outer pop-out highlights and deep shadow bevel contours -->
  <path d="M 12 16 L 116 16 L 116 92 L 12 92 Z" fill="#6b6b6b" />
  <path d="M 14 18 L 116 18 L 116 92 L 14 92 Z" fill="#f2f2f2" />
  <path d="M 14 18 L 114 18 L 114 90 L 14 90 Z" fill="#aeaeae" />

  <!-- Inner Sunken Glass Screen Frame (Inverted Bevels) -->
  <path d="M 22 24 L 106 24 L 106 76 L 22 76 Z" fill="#dbdbdb" />
  <path d="M 22 24 L 104 24 L 106 74 L 22 74 Z" fill="#4d4d4d" />
  <!-- Glass Terminal Viewport Area Base -->
  <path d="M 24 26 L 104 26 L 104 74 L 24 74 Z" fill="#26262b" />

  <!-- ========================================================================= -->
  <!-- RETRO MULTI-ROOM GRAPHICAL BRANDING OVERLAY LAYOUTS                       -->
  <!-- ========================================================================= -->
  <!-- Left Wing Block (Workspace Grid Layout Graphic) -->
  <path d="M 32 34 L 60 34 L 60 66 L 32 66 Z" fill="#5c5c5c" />
  <path d="M 33 35 L 60 35 L 60 66 L 33 66 Z" fill="#ffffff" />
  <path d="M 33 35 L 59 35 L 59 65 L 33 65 Z" fill="#aeaeae" />
  <!-- Room Matrix crossline separations -->
  <line x1="46" y1="35" x2="46" y2="65" stroke="#5c5c5c" stroke-width="1" />
  <line x1="33" y1="50" x2="59" y2="50" stroke="#5c5c5c" stroke-width="1" />
  <line x1="47" y1="35" x2="47" y2="65" stroke="#ffffff" stroke-width="1" />
  <line x1="33" y1="51" x2="59" y2="51" stroke="#ffffff" stroke-width="1" />

  <!-- Right Wing Color Palette Blocks (Iconic Slate-Blue Header simulation) -->
  <!-- Row 1: Active Window Slate Blue Flag Header -->
  <path d="M 68 34 L 96 34 L 96 42 L 68 44 Z" fill="#4a6fa5" />
  <rect x="72" y="37" width="20" height="2" fill="#ffffff" opacity="0.7" />
  <!-- Row 2: Standard Terminal Teal Flag Area -->
  <path d="M 68 46 L 96 46 L 96 54 L 68 54 Z" fill="#007a7a" />
  <!-- Row 3: Motif Maroon Flag Area -->
  <path d="M 68 58 L 96 58 L 96 66 L 68 66 Z" fill="#66334c" />

  <!-- ========================================================================= -->
  <!-- MONITOR NECK & STAND SUPPORT ASSEMBLY                                     -->
  <!-- ========================================================================= -->
  <!-- Tapered Neck Casing Support -->
  <path d="M 48 92 L 80 92 L 74 104 L 54 104 Z" fill="#7a7a7a" />
  <path d="M 49 92 L 74 92 L 74 104 L 54 104 Z" fill="#bebebe" />

  <!-- Flat Heavy Desktop Base Stand Footprint -->
  <path d="M 28 104 L 100 104 L 104 112 L 24 112 Z" fill="#5c5c5c" />
  <path d="M 29 105 L 100 105 L 102 111 L 26 111 Z" fill="#ffffff" />
  <path d="M 30 105 L 98 105 L 98 110 L 30 110 Z" fill="#aeaeae" />

  <!-- Power LED Light Indicator Dot -->
  <circle cx="64" cy="85" r="1.5" fill="#47d147" />
</svg>
